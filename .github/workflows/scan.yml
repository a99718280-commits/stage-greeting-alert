name: Stage Greeting Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan stage greetings
        run: |
          curl --fail --silent --show-error --max-time 120 \
          https://stage-greeting-alert.onrender.com/api/scan
